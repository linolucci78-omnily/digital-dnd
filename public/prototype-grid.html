<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Grid Prototype — Mappa + Reticolo + Token</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0d8c8;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
.header{padding:16px 24px;background:rgba(10,10,15,.95);border-bottom:1px solid rgba(201,168,76,.1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-family:'Cinzel',serif;font-size:1rem;color:#C9A84C;letter-spacing:.1em}
.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.control-group{display:flex;align-items:center;gap:6px}
.control-group label{font-size:.7rem;color:rgba(224,216,200,.4);letter-spacing:.05em;text-transform:uppercase}
.control-group input[type="range"]{width:80px;accent-color:#DC143C}
.control-group span{font-size:.7rem;color:#C9A84C;min-width:28px}
.btn{padding:6px 16px;font-family:'Cinzel',serif;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(220,20,60,.3);background:linear-gradient(135deg,#1a0808,#0a0505);color:#C9A84C;cursor:pointer;transition:all .3s}
.btn:hover{background:linear-gradient(135deg,#2a1010,#1a0808);border-color:#DC143C;box-shadow:0 0 15px rgba(220,20,60,.2)}
.btn.active{background:linear-gradient(135deg,#4a1515,#2a0808);border-color:#DC143C}

/* MAIN LAYOUT */
.main{flex:1;display:flex;overflow:hidden}

/* MAP AREA */
.map-area{flex:1;position:relative;overflow:auto;display:flex;align-items:center;justify-content:center;background:#050508}
.map-container{position:relative;display:inline-block;cursor:crosshair}
.map-container img{display:block;user-select:none;-webkit-user-drag:none}

/* CSS GRID OVERLAY */
.grid-overlay{position:absolute;inset:0;pointer-events:none;z-index:2;background-image:
  linear-gradient(rgba(201,168,76,var(--grid-opacity)) 1px, transparent 1px),
  linear-gradient(90deg, rgba(201,168,76,var(--grid-opacity)) 1px, transparent 1px);
background-size:var(--cell-size) var(--cell-size);transition:opacity .3s}

/* HOVER HIGHLIGHT */
.cell-hover{position:absolute;z-index:3;pointer-events:none;background:rgba(220,20,60,.12);border:1px solid rgba(220,20,60,.25);display:none;transition:none}

/* MOVE RANGE HIGHLIGHT */
.move-cell{position:absolute;z-index:2;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.15);pointer-events:none}

/* TOKENS */
.token{position:absolute;z-index:10;cursor:grab;border-radius:50%;border:2px solid;box-shadow:0 2px 12px rgba(0,0,0,.6);transition:box-shadow .2s;overflow:hidden;display:flex;align-items:center;justify-content:center}
.token:hover{box-shadow:0 4px 20px rgba(0,0,0,.8),0 0 15px rgba(201,168,76,.3)}
.token.dragging{cursor:grabbing;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.9),0 0 25px rgba(220,20,60,.4);transform:scale(1.15)}
.token img{width:100%;height:100%;object-fit:cover;mix-blend-mode:screen}
.token.player{border-color:rgba(201,168,76,.6)}
.token.enemy{border-color:rgba(220,20,60,.6)}
.token .hp-bar{position:absolute;bottom:1px;left:2px;right:2px;height:3px;background:rgba(0,0,0,.6);border-radius:2px;z-index:2}
.token .hp-fill{height:100%;border-radius:2px;transition:width .3s}
.token .token-label{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.5rem;font-family:'Cinzel',serif;color:#C9A84C;white-space:nowrap;text-shadow:0 1px 4px #000;opacity:0;transition:opacity .2s}
.token:hover .token-label{opacity:1}

/* SIDEBAR */
.sidebar{width:220px;background:rgba(8,8,12,.95);border-left:1px solid rgba(201,168,76,.06);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-section{padding:16px;border-bottom:1px solid rgba(201,168,76,.04)}
.sidebar-title{font-family:'Cinzel',serif;font-size:.65rem;color:rgba(201,168,76,.4);letter-spacing:.15em;text-transform:uppercase;margin-bottom:12px}

/* TOKEN TRAY */
.tray-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tray-token{width:100%;aspect-ratio:1;background:rgba(20,18,15,.8);border:1px solid rgba(201,168,76,.08);border-radius:50%;cursor:grab;display:flex;align-items:center;justify-content:center;transition:all .3s;position:relative;overflow:hidden}
.tray-token:hover{border-color:rgba(201,168,76,.2);background:rgba(30,25,20,.8);transform:scale(1.05)}
.tray-token img{width:80%;height:80%;object-fit:contain;mix-blend-mode:screen}
.tray-token .tray-label{position:absolute;bottom:-18px;font-size:.45rem;color:rgba(224,216,200,.3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}

/* INFO PANEL */
.info{padding:16px}
.info-title{font-family:'Cinzel',serif;font-size:.85rem;color:#C9A84C;margin-bottom:8px}
.info-row{display:flex;justify-content:space-between;font-size:.7rem;color:rgba(224,216,200,.35);margin-bottom:4px}
.info-val{color:rgba(224,216,200,.6)}

/* INITIATIVE */
.init-list{display:flex;flex-direction:column;gap:4px}
.init-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;background:rgba(20,18,15,.5);border:1px solid transparent;font-size:.7rem;transition:all .2s}
.init-item.active{border-color:rgba(220,20,60,.3);background:rgba(220,20,60,.06)}
.init-pip{width:10px;height:10px;border-radius:50%;border:2px solid;flex-shrink:0}
.init-name{flex:1;color:rgba(224,216,200,.5)}
.init-val{color:#C9A84C;font-family:'Cinzel',serif;font-size:.7rem}

/* STATUS BAR */
.status-bar{padding:8px 24px;background:rgba(10,10,15,.95);border-top:1px solid rgba(201,168,76,.06);display:flex;align-items:center;gap:20px;font-size:.65rem;color:rgba(224,216,200,.25)}
.status-bar .coord{color:#C9A84C}
.status-bar .cell-info{color:rgba(224,216,200,.4)}
</style>
</head>
<body>

<div class="header">
  <h1>⚔ D&D Battlemap</h1>
  <div class="controls">
    <div class="control-group">
      <label>Griglia</label>
      <input type="range" id="cellSize" min="30" max="80" value="50">
      <span id="cellVal">50</span>
    </div>
    <div class="control-group">
      <label>Opacità</label>
      <input type="range" id="gridOpacity" min="0" max="50" value="15">
      <span id="opVal">15%</span>
    </div>
    <div class="control-group">
      <label>Colore</label>
      <select id="gridColor" style="background:#111;color:#C9A84C;border:1px solid rgba(201,168,76,.2);padding:3px 6px;font-size:.65rem">
        <option value="201,168,76">Oro</option>
        <option value="220,20,60">Sangue</option>
        <option value="255,255,255">Bianco</option>
        <option value="100,200,255">Ghiaccio</option>
      </select>
    </div>
    <button class="btn" id="toggleGrid">Nascondi Griglia</button>
    <button class="btn" id="clearTokens">Reset Token</button>
  </div>
</div>

    <div class="sidebar-section">
      <div class="sidebar-title">Iniziativa</div>
      <div class="init-list" id="initList"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Info Cella</div>
      <div class="info" id="cellInfo">
        <div class="info-row"><span>Posizione</span><span class="info-val" id="infoPos">—</span></div>
        <div class="info-row"><span>Occupata da</span><span class="info-val" id="infoOccupant">—</span></div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Carica Mappa</div>
      <input type="file" id="mapUpload" accept="image/*" style="font-size:.65rem;color:rgba(224,216,200,.4)">
    </div>
  </div>
</div>

<div class="status-bar">
  <span>Cursore: <span class="coord" id="statusCoord">—</span></span>
  <span>Cella: <span class="coord" id="statusCell">—</span></span>
  <span class="cell-info" id="statusInfo">Trascina i token dalla sidebar sulla mappa</span>
</div>

<script>
const mapContainer = document.getElementById('mapContainer');
const mapImg = document.getElementById('mapImg');
const gridOverlay = document.getElementById('gridOverlay');
const cellHover = document.getElementById('cellHover');
const initList = document.getElementById('initList');

let cellSize = 50;
let gridVisible = true;
let tokens = [];
let tokenIdCounter = 0;
let draggedTrayToken = null;
let draggedMapToken = null;
let dragOffset = {x:0, y:0};

// Grid controls
document.getElementById('cellSize').addEventListener('input', e => {
  cellSize = parseInt(e.target.value);
  document.getElementById('cellVal').textContent = cellSize;
  gridOverlay.style.setProperty('--cell-size', cellSize + 'px');
  // Reposition tokens to new grid
  tokens.forEach(t => {
    const newX = t.gridCol * cellSize;
    const newY = t.gridRow * cellSize;
    t.el.style.left = newX + 'px';
    t.el.style.top = newY + 'px';
    t.el.style.width = cellSize + 'px';
    t.el.style.height = cellSize + 'px';
  });
});

document.getElementById('gridOpacity').addEventListener('input', e => {
  const v = parseInt(e.target.value);
  document.getElementById('opVal').textContent = v + '%';
  gridOverlay.style.setProperty('--grid-opacity', (v/100).toFixed(2));
});

document.getElementById('gridColor').addEventListener('change', e => {
  const c = e.target.value;
  gridOverlay.style.backgroundImage = `linear-gradient(rgba(${c},var(--grid-opacity)) 1px, transparent 1px), linear-gradient(90deg, rgba(${c},var(--grid-opacity)) 1px, transparent 1px)`;
});

document.getElementById('toggleGrid').addEventListener('click', e => {
  gridVisible = !gridVisible;
  gridOverlay.style.opacity = gridVisible ? 1 : 0;
  e.target.textContent = gridVisible ? 'Nascondi Griglia' : 'Mostra Griglia';
  e.target.classList.toggle('active', !gridVisible);
});

document.getElementById('clearTokens').addEventListener('click', () => {
  tokens.forEach(t => t.el.remove());
  tokens = [];
  updateInitiative();
});

// Map upload
document.getElementById('mapUpload').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { mapImg.src = ev.target.result; };
  reader.readAsDataURL(file);
});

// Cell hover
mapContainer.addEventListener('mousemove', e => {
  const rect = mapContainer.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const col = Math.floor(x / cellSize);
  const row = Math.floor(y / cellSize);
  
  cellHover.style.display = 'block';
  cellHover.style.left = (col * cellSize) + 'px';
  cellHover.style.top = (row * cellSize) + 'px';
  cellHover.style.width = cellSize + 'px';
  cellHover.style.height = cellSize + 'px';
  
  document.getElementById('statusCoord').textContent = `${Math.round(x)}, ${Math.round(y)}`;
  document.getElementById('statusCell').textContent = `${col}, ${row}`;
  document.getElementById('infoPos').textContent = `Colonna ${col}, Riga ${row}`;
  
  const occupant = tokens.find(t => t.gridCol === col && t.gridRow === row);
  document.getElementById('infoOccupant').textContent = occupant ? `${occupant.name} (HP: ${occupant.hp}/${occupant.maxHp})` : '—';
});

mapContainer.addEventListener('mouseleave', () => {
  cellHover.style.display = 'none';
});

// DRAG FROM TRAY
document.querySelectorAll('.tray-token').forEach(tray => {
  tray.addEventListener('dragstart', e => {
    draggedTrayToken = tray;
    e.dataTransfer.effectAllowed = 'copy';
  });
});

mapContainer.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});

mapContainer.addEventListener('drop', e => {
  e.preventDefault();
  if (!draggedTrayToken) return;
  
  const rect = mapContainer.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const col = Math.floor(x / cellSize);
  const row = Math.floor(y / cellSize);
  
  // Check if cell occupied
  if (tokens.find(t => t.gridCol === col && t.gridRow === row)) {
    draggedTrayToken = null;
    return;
  }
  
  createToken(draggedTrayToken, col, row);
  draggedTrayToken = null;
});

function createToken(trayEl, col, row) {
  const type = trayEl.dataset.type;
  const name = trayEl.dataset.name;
  const color = trayEl.dataset.color;
  const hp = parseInt(trayEl.dataset.hp);
  const maxHp = parseInt(trayEl.dataset.maxhp);
  const imgSrc = trayEl.querySelector('img').src;
  
  const el = document.createElement('div');
  el.className = `token ${type}`;
  el.style.left = (col * cellSize) + 'px';
  el.style.top = (row * cellSize) + 'px';
  el.style.width = cellSize + 'px';
  el.style.height = cellSize + 'px';
  el.style.borderColor = `rgba(${color},.6)`;
  el.innerHTML = `
    <img src="${imgSrc}" draggable="false">
    <div class="hp-bar"><div class="hp-fill" style="width:${(hp/maxHp)*100}%;background:${hp/maxHp>.5?'#22c55e':hp/maxHp>.25?'#eab308':'#ef4444'}"></div></div>
    <div class="token-label">${name}</div>
  `;
  
  mapContainer.appendChild(el);
  
  const tokenData = {
    id: tokenIdCounter++,
    el, name, type, color, hp, maxHp,
    gridCol: col, gridRow: row
  };
  tokens.push(tokenData);
  
  // Token dragging on map
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    draggedMapToken = tokenData;
    const rect = el.getBoundingClientRect();
    dragOffset.x = e.clientX - rect.left;
    dragOffset.y = e.clientY - rect.top;
    el.classList.add('dragging');
    document.getElementById('statusInfo').textContent = `Muovendo ${name}...`;
  });
  
  // Right click to deal damage
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    const dmg = parseInt(prompt(`Danno a ${name}? (negativo per curare)`));
    if (isNaN(dmg)) return;
    tokenData.hp = Math.max(0, Math.min(tokenData.maxHp, tokenData.hp - dmg));
    const pct = tokenData.hp / tokenData.maxHp;
    const hpFill = el.querySelector('.hp-fill');
    hpFill.style.width = (pct*100) + '%';
    hpFill.style.background = pct > .5 ? '#22c55e' : pct > .25 ? '#eab308' : '#ef4444';
    if (tokenData.hp === 0) {
      el.style.opacity = '.3';
      el.style.filter = 'grayscale(1)';
    } else {
      el.style.opacity = '1';
      el.style.filter = 'none';
    }
  });
  
  updateInitiative();
}

// Mouse move/up for token dragging
document.addEventListener('mousemove', e => {
  if (!draggedMapToken) return;
  const rect = mapContainer.getBoundingClientRect();
  const x = e.clientX - rect.left - dragOffset.x;
  const y = e.clientY - rect.top - dragOffset.y;
  draggedMapToken.el.style.left = x + 'px';
  draggedMapToken.el.style.top = y + 'px';
});

document.addEventListener('mouseup', e => {
  if (!draggedMapToken) return;
  const rect = mapContainer.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const col = Math.floor(x / cellSize);
  const row = Math.floor(y / cellSize);
  
  // Check occupied (by another token)
  const occupant = tokens.find(t => t.id !== draggedMapToken.id && t.gridCol === col && t.gridRow === row);
  if (occupant) {
    // Snap back
    draggedMapToken.el.style.left = (draggedMapToken.gridCol * cellSize) + 'px';
    draggedMapToken.el.style.top = (draggedMapToken.gridRow * cellSize) + 'px';
  } else {
    draggedMapToken.gridCol = col;
    draggedMapToken.gridRow = row;
    draggedMapToken.el.style.left = (col * cellSize) + 'px';
    draggedMapToken.el.style.top = (row * cellSize) + 'px';
  }
  
  draggedMapToken.el.classList.remove('dragging');
  document.getElementById('statusInfo').textContent = `${draggedMapToken.name} → Colonna ${draggedMapToken.gridCol}, Riga ${draggedMapToken.gridRow}`;
  draggedMapToken = null;
});

function updateInitiative() {
  initList.innerHTML = '';
  // Sort by random initiative
  const sorted = [...tokens].sort((a,b) => (b._init||0) - (a._init||0));
  sorted.forEach((t, i) => {
    if (!t._init) t._init = Math.floor(Math.random() * 20) + 1;
    const div = document.createElement('div');
    div.className = 'init-item' + (i === 0 ? ' active' : '');
    div.innerHTML = `<div class="init-pip" style="border-color:rgba(${t.color},.6);background:rgba(${t.color},.2)"></div><span class="init-name">${t.name}</span><span class="init-val">${t._init}</span>`;
    initList.appendChild(div);
  });
}
</script>
</body>
</html>
